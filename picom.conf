######################   GENERAL SETS ###########################3
daemon = true;
backend = "glx";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
#detect-client-leader = true;
unredir-if-possible = true;
#unredir-if-possible-delay = 0;
use-damage = true;
force-win-blend = true;
log-level = "warn";
# log-file = "/path/to/your/log/file"
# show-all-xerrors = false


######################   SHADOWS  ###########################3
shadow = true;
full-shadow = false;
#shadow-radius = 16
#shadow-opacity = 0.50
#shadow-offset-x = -16
#shadow-offset-y = -16
# shadow-red = 0
# shadow-green = 0
# shadow-blue = 0
#shadow-color = "#000000";


######################   FADING  ###########################3
fading = true;
fade-in-step = 0.025;
fade-out-step = 0.025;
fade-delta = 5;
no-fading-openclose = false;
no-fading-destroyed-argb = false;


######################   TRANSPARENCY ###########################3
frame-opacity = 0.75;


######################   CORNERS ###########################3
corner-radius = 12;


######################   BLUR ###########################3
blur:	{
#none, gaussian, box, kernel, dual_kawase
		method = "dual_kawase";
#		method = "gaussian";
# affects gaussian and box - def 3 max 20
#        	size = 5;
# standard deviation for gaussian default: 0.84089642
#		deviation = 3.14;
# 0-20 for dual kawase. def. 5 - 5/12 sweet spot - if 0 then autoestimate
		strength =2;
#3x3box (default), 5x5box, 7x7box, 3x3gaussian, 5x5gaussian, 7x7gaussian, 9x9gaussian, 11x11gaussian.
#		kern = "11x11gaussian";
	}


######################   RULES ###########################3
rules: (

######################   GENERAL BLUR SET ###########################3
{blur-opacity = 1;},


######################   NORMAL WINDOWS ###########################3
	{
	match = "window_type = 'normal'";
# animations------------------------------------------##
                animations =    (
# open animation ------------------------------------##
                        {
                        triggers = ["open"];
		        preset = "fly-in";
		        direction = "up";
      		        duration = 0.25;
                        },
# close animation ------------------------------------##
                       {
                        triggers = ["close"];
        		preset = "disappear";
	        	scale = 0.75;
     	        	duration = 0.25;
                        },
# show from minimized animation -------------------------##
                        {
                        triggers = ["show"];
        		preset = "fly-in";
	        	direction = "down";
      	        	duration = 0.25;
 	                },
# hide to taskbar animation -----------------------------##
                   	{
                        triggers = ["hide"];
        		preset = "fly-out";
	        	direction = "down";
     	        	duration = 0.25;
 	                },
# geometry animation ------------------------------------##
                        {
                        triggers = ["size", "position"];
                        scale-x = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-width-before / window-width";
                                end = 1;
                                };
                        scale-x-reverse = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-width / window-width-before";
                                end = 1;
                                };
                        scale-y = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-height-before / window-height";
                                end = 1;
                                };
                        scale-y-reverse = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-height / window-height-before";
                                end = 1;
                                };
                        offset-x = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-x-before - window-x";
                                end = 0;
                                };
                        offset-y = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-y-before - window-y";
                                end = 0;
                                };
                        shadow-scale-x = "scale-x";
                        shadow-scale-y = "scale-y";
                        shadow-offset-x = "offset-x";
                        shadow-offset-y = "offset-y";
                        },),},
# end of animations ------------------------------------##
## end for NORMAL WINDOW -------------------------------#3



###########   ANIMATIONS XFDASHBOARD ################3
	{
        match = "name = 'xfdashboard'";
                opacity = 0.85;
		animations =    (
                        {
                        triggers = ["hide" , "close"];
        		preset = "fly-out";
	        	direction = "down";
     	        	duration = 0.25;
 	                },),},


###########    ANIMATIONS DIALOG WINDOWS Y QT   ################3
        {
        match = "window_type = 'dialog' || "
                "class_i = 'megasync' ||"
                "class_i = 'vlc' ||"
                "class_i = 'qbittorrent' || "
                "class_i = 'qdirstat' || "
                "class_i = 'wpa_gui'";
# animations------------------------------------------##
                animations =    (
# open animation ------------------------------------##
                        {
                        triggers = ["open", "show"];
        		preset = "appear";
	           	scale = 0.75;
      	        	duration = 0.25;
                        },
# close animation ------------------------------------##
                       {
                        triggers = ["close", "hide"];
        		preset = "disappear";
	        	scale = 0.75;
     	        	duration = 0.25;
                        },
# geometry animation ------------------------------------##
                        {
                        triggers = ["size", "position"];
                        scale-x = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-width-before / window-width";
                                end = 1;
                                };
                        scale-x-reverse = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-width / window-width-before";
                                end = 1;
                                };
                        scale-y = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-height-before / window-height";
                                end = 1;
                                };
                        scale-y-reverse = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-height / window-height-before";
                                end = 1;
                                };
                        offset-x = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-x-before - window-x";
                                end = 0;
                                };
                        offset-y = {
                                curve = "cubic-bezier(0,0,0,1.28)";
                                duration = 0.25;
                                start = "window-y-before - window-y";
                                end = 0;
                                };
                        shadow-scale-x = "scale-x";
                        shadow-scale-y = "scale-y";
                        shadow-offset-x = "offset-x";
                        shadow-offset-y = "offset-y";
                        },),},
# end of animations ------------------------------------##


###########   GTK4 THEMES SHADOW FIX Y OTRAS APPS ################3
        {
	match = "_GTK_FRAME_EXTENTS@ || "
                "window_type = 'menu' ||"
		"class_i = 'xfdesktop' || "
                "name = 'xfce4-find-cursor' ||"
                "role = 'popup' || "
                "name = 'xfce4-notifyd'";
		        shadow = false;
                        full-shadow = false;
                        blur-opacity = 0;
	},


###########   BACKGROUND BLUR ALT + TAB ################
	{
	match =	"class_i = 'xfwm4-wireframe'";
                      blur-opacity = 0.5;
        },


###########   TRANSPARENCIAS TOOLTIPS ################3
	{
	match =	"window_type = 'tooltip'";
                        corner-radius = 0;
                        opacity = 0.75;
                        blur-opacity = 0.75;
        },


###########           APPFINDER BLUR        ################3
	{
	match =	"class_i = 'xfce4-appfinder'";
                      opacity = 0.85;
        },

###########   SCREENSHOOTER ANIMACIONES Y BLUR ################3
	{
	match =	"class_i ~= 'xfce4-screenshooter$'";
# animations------------------------------------------##
                        animations = (
                      { triggers = ["open", "show"]; duration = 0; },
                      { triggers = ["close", "hide"]; duration = 0; });
                      blur-opacity = 0;
                      blur-background = 0;
        },


###########   BACKGROUND BLUR XTERM ################3
	{
	match =	"class_i = 'xterm'";
                      opacity = 0.75;
        },


###########   APPS MAXIMIZADAS, FULLSCREEN , RULER Y DESKTOP ################3
	{
	match =	"class_i = 'screenruler.rb' || "
		"class_i = 'xfdesktop' || "
#                "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ' ||"
                        "fullscreen";
			corner-radius = 0;
			shadow = false;
                        full-shadow = false;
      	},


