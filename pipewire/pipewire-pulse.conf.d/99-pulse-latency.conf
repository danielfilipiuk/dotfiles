# ~/.config/pipewire/pipewire-pulse.conf.d/99-pulse-latency.conf
pulse.properties = {
    # Force Pulse clients to request smaller buffers (128 samples at 48kHz)
    pulse.min.req          = 128/48000
    pulse.min.quantum      = 128/48000
    pulse.min.frag         = 128/48000
    pulse.default.req      = 128/48000
    pulse.default.quantum  = 128/48000
    pulse.default.format   = F32
}
