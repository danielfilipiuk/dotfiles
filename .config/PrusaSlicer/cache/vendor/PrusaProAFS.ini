machine_max_feedrate_y = 400
machine_max_feedrate_z = 20
machine_max_jerk_e = 10
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 2
machine_min_extruding_rate = 0
machine_min_travel_rate = 0
max_layer_height = 0.25
min_layer_height = 0.07
remaining_times = 1
prefer_clockwise_movements = 1
printer_notes = Do not remove the keywords below.\nPRINTER_VENDOR_PRUSA3D\nPRINTER_MODEL_iX\nPG\nAFS\nNO_TEMPLATES
retract_lift_below = 174
retract_speed = 35
deretract_speed = 25
retract_before_travel = 1.5
retract_before_wipe = 80%
retract_layer_change = 1
retract_length = 0.7
retract_length_toolchange = 0
start_gcode = M862.3 P "[printer_model]" ; printer model check\nM862.1 P[nozzle_diameter] ; nozzle diameter check\n;--- METRIC SECTION\nM330 SYSLOG\nM331 loadcell\nM331 loadcell_threshold\nM331 loadcell_hysteresis\nM331 loadcell_scale\nM331 probe_z\nM331 probe_z_diff\nM331 home_diff\nM331 temp_hbr\nM331 temp_bed\nM331 temp_noz\nM331 temp_brd\nM331 ttemp_bed\nM331 ttemp_noz\nM331 pos_z\nM331 fan_speed\nM331 fan_hbr_speed\nM331 tmc_sg_x\nM331 tmc_sg_y\nM331 tmc_sg_z\nM331 tmc_sg_e\nM331 bedlet_temp\nM331 bedlet_target\nM331 bedlet_pwm\nM331 bed_curr\nM331 bedlet_state\nM331 bedlet_curr\nM331 bed_state\nM331 fsensor\nM331 side_fsensor\nM331 bedlet_prhtemp\n;--- END OF METRIC SECTION\n;--- START G-CODE\n;--- Print Area & Initial Setup\nM221 S100 ; reset flow\nM17 ; enable steppers\nM555 X{(min(print_bed_max[0], first_layer_print_min[0] + 32) - 32)} Y{(max(0, first_layer_print_min[1]) - 4)} W{((min(print_bed_max[0], max(first_layer_print_min[0] + 32, first_layer_print_max[0])))) - ((min(print_bed_max[0], first_layer_print_min[0] + 32) - 32))} H{((first_layer_print_max[1])) - ((max(0, first_layer_print_min[1]) - 4))} ; print area\nG90 ; use absolute coordinates\nM83 ; extruder relative mode\nG92 E0.0 ; reset extruder position\nM142 S{(filament_type[0] == "PC") ? 60 : (filament_type[0] == "ASA") ? 60 : (filament_type[0] == "ABS") ? 60 : (filament_type[0] == "PA") ? 60 : (filament_type[0]=~/.*PET.*/) ? 55 : (filament_type[0] == "PLA") ? 40 : 40} ; set heatbreak temp\nM140 S[first_layer_bed_temperature] ; set bed temp\n;--- End Print Area & Initial Setup\n;--- Homing & Pre-Heat\nM109 T0 S150 ; pre-heat for home\nG28 XY ; home X/Y axis\nG27 P4 ; parking position\nM591 S0 ; disable stuck filament detection\nM109 T0 R{((filament_notes[0]=~/.*HT_MBL10.*/) ? (first_layer_temperature[0] - 10) : (filament_type[0] == "PC" or filament_type[0] == "PA") ? (first_layer_temperature[0] - 25) : (filament_type[0] == "FLEX") ? 210 : (filament_type[0]=~/.*PET.*/) ? 175 : 170)} ; wait for temp\n;--- End Homing & Pre-Heat\n;--- Nozzle Check Start\nG1 X208.75 Y295 F2000 ; unpark to A2\nG12 R\nG28 Z ; home Z\nG27 P4 ; parking position\n;--- Nozzle Check End\nM190 S[first_layer_bed_temperature] ; wait for bed temp\n;--- MBL (Mesh Bed Leveling)\nG1 X208.75 Y295 F2000 ; unpark to A2\nG29 P1 ; invalidate mbl & probe print area\nG29 P1 X216 Y245 W50 H20 C ; probe near purge place\nG29 P3.2 ; interpolate mbl probes\nG29 P3.13 ; extrapolate mbl outside probe area\nG29 A ; activate mbl\nG27 P4 ; parking position\n;--- End MBL\n;--- Prepare for Purge\nM109 S{first_layer_temperature[0]} ; wait for nozzle temp\nG1 X244.6 Y272.21 F4000 ; move to purge start\nG1 X260 Y263 F4000 ; start purge position\n;--- End Prepare for Purge\n;--- Extrude Purge Line\nG1 Z0.8 F600 ; lift to purge height\nG1 E6 X240 Z0.2 F800 ; extrude 6mm while moving down\nG1 X230 E8 Z7.2 F300 ; extrude 8mm while lifting\nG1 X220 E4 Z0.2 F500 ; extrude 4mm while lowering\nG1 X210 E4 F700 ; extrude 4mm \nG1 X190 E8 F1000 ; extrude 8mm final purge\nG1 X185 Z0.05 F8000 ; wipe move close to bed\nG1 X183 Z0.2 F8000 ; wipe lift to clear purge line\nM591 R ; enable stuck filament detection\nG92 E0.0 ; reset extruder position\n;--- End Extrude Purge Line
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0.0\n;[layer_z]
end_gcode = ;--- END G-CODE\n;--- Retract & Lift\nG92 E0.0 ; reset extruder position\nG1 E-9 F3000 ; fast retract\nG1 Z{z_offset+min(layer_z+5, max_print_height)} F1000 ; move heatbed down\n;--- End Retract & Lift\n;--- Shutdown Sequence\nM104 S0 ; turn off extruder heater\nM107 ; turn off part cooling fan\n;--- End Shutdown Sequence\n;--- Park & Disable\nG27 W1 P4 ; move to bucket position\nG1 Z{max_print_height} F700 ; lower bed to maximum\nM221 S100 ; reset flow\n;--- End Park & Disable\n; max_layer_z = [max_layer_z]
default_print_profile = 0.20 mm SPEED @AFS 0.4
