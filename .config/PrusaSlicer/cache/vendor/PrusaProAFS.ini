# Print profiles for Prusa Pro AFS

[vendor]
repo_id = prusa-pro-afs
name = Prusa Pro AFS
config_version = 1.0.7

# The printer models will be shown by the Configuration Wizard in this order,
# also the first model installed & the first nozzle installed will be activated after install.
# Printer model name will be shown by the installation wizard.
 
[printer_model:iX]
name = Prusa Pro iX
variants = 0.4
technology = FFF
family = Prusa Pro AFS
bed_model = afs_bed.stl
bed_texture = afs.svg
thumbnail = AFS_thumbnail.png
default_materials = Prusament PLA @AFS; Prusament PETG @AFS; Prusament PC @AFS; Prusament PCCF @AFS; Prusament ASA @AFS; Buddy3D ABS @AFS

# All presets starting with asterisk, for example *common*, are intermediate and they will
# not make it into the user interface.

