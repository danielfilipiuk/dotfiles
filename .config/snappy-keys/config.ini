# Snappy Keys Configuration
# Default location: ~/.config/snappy-keys/config.ini

[Settings]
# Theme to use. Available bundled themes: default, catppuccin-mocha, nord, solarized-dark
# If a theme is set, the colors below in [Colors] will override the theme's colors.
theme = default

# Layout mode: "ticker" (horizontal strip) or "stack" (vertical column)
layout = ticker

# Anchor position: bottom-right, bottom-left, bottom-center,
#                  top-right, top-left, top-center, center
anchor = bottom-right

# Bubble timeout in milliseconds (100–10000)
# Keys typed within this window are grouped into the same bubble
timeout_ms = 800

# Font size in points (6–72)
font_size = 15

# Fade animation framerate (1–144)
fade_fps = 45

# Space bar behavior:
#   badge   — Space is a word delimiter (creates a separate "Space" bubble)
#   literal — Space appends " " to the current bubble (sentence mode).
#             Long text will dynamically word-wrap inside the bubble.
space_mode = badge

[Overrides]
# Remap raw XKB key names to custom display strings.
# Format: RawKeyName = DisplayName
#
# Core fallbacks are loaded automatically (Return=Enter, BackSpace=Bksp, etc.)
# Entries here overwrite or extend the built-in table.

Super_L = ⌘
Super_R = ⌘
BackSpace = ⟵
Return = ⏎
# If left empty (space = ), it will display a normal blank space (" ").
space = ␣
Escape = ⎋
Tab = ⇥
Caps_Lock = ⇪

[Colors]
# Theme colors in hex (#RRGGBB or #RRGGBBAA)
# All colors are optional — only override what you want to change from the active theme.

# bg_color = #26262ED1
# text_color = #FFFFFFFF
# accent_color = #8C8CD9FF
# border_color = #59596699
# badge_color = #D9404CFF
# badge_text_color = #FFFFFFFF
# hold_badge_color = #3399A6FF
