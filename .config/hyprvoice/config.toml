# Hyprvoice Configuration
# Generated by hyprvoice onboarding or configure
# Changes are applied immediately without daemon restart.

# API Keys for providers
[providers.openai]
  api_key = "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"

# Audio Recording Configuration
[recording]
  sample_rate = 16000
  channels = 1
  format = "s16"
  buffer_size = 8192
  device = ""
  channel_buffer_size = 30
  timeout = "5m0s"

# Speech Transcription Configuration
[transcription]
  provider = "whisper-cpp"
  language = "es"
  model = "large-v3"
  streaming = false
  threads = 15

# LLM Post-Processing Configuration
[llm]
  enabled = false
  provider = "openai"
  model = "gpt-4o-mini"

  [llm.post_processing]
    remove_stutters = true
    add_punctuation = true
    fix_grammar = true
    remove_filler_words = true

  [llm.custom_prompt]
    enabled = false

# Text Injection Configuration
[injection]
  backends = ["wtype", "clipboard"]
  ydotool_timeout = "5s"
  wtype_timeout = "5s"
  clipboard_timeout = "3s"

# Desktop Notification Configuration
[notifications]
  enabled = true
  type = "desktop"

  [notifications.messages]
    [notifications.messages.recording_started]
      title = "Hyprvoice"
      body = "Recording Started"
