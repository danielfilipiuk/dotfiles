# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = JetBrainsMonoNerdFont

general {
    hide_cursor = true
    fractional_scaling = 1
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 5, 1, linear
    animation = inputFieldFade, 1, 5, linear
    animation = inputFieldColors, 1, 5, linear
    animation = inputFieldWidth, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    
#color = rgba(25, 20, 20, 1.0)
    blur_passes = 5
    blur_size = 1
	noise = 0.025
#	contrast = 0.25
	vibrancy = 0.25
	vibrancy_darkness = 0.25
}
# INPUT FIELD

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3

    #inner_color = rgba(202, 158, 230, .25)
    inner_color = rgba(248, 246, 242, .15)
    
    outer_color = rgba(0, 255, 153, 1)  rgba(238, 130, 238,1)  150deg
    check_color = rgba(238, 130, 238,.85) rgba(ff6633cc) 45deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 90deg

    numlock_color = rgba(238, 130, 238,1) rgba(0, 255, 153, 1) 45deg
    capslock_color = rgba(238, 130, 238,1) rgba(0, 255, 153, 1) 45deg
    bothlock_color = rgba(238, 130, 238,.85) rgba(ff6633cc) 45deg

    font_color = rgba(248,246,242,.85)
    fade_on_empty = true
    rounding = 25

    shadow_passes = 0
    shadow_size = 0

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
     dots_text_format = *
    dots_size = 0.5
    dots_spacing = 1


    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -200
    halign = center
    valign = center
    zindex = 12
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font
    color = rgba(248,246,242,.75)

    position = 0, -50
    halign = center
    valign = top

    shadow_passes = 0
    shadow_size = 0
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B" # update every 60 seconds
    font_size = 25
    font_family = $font
    color = rgba(248,246,242,.55)

    position = 0, -200
    halign = center
    valign = top

    shadow_passes = 0
    shadow_size = 0
}

# HYPRLAND LOGO
image {
    monitor = 
    path = /home/daniel/pictures/hyprland/hyprland_big.png
    size = 70
    border_size = 0
    border_color = rgba(202, 158, 230, 0) rgba(61, 174, 233, 1) 45deg
    halign = center
    valign = center
    #position = 500 500
}    

# CIRCLE AROUND LOGO
shape {
    monitor =
    size = 150, 150
    color = rgba(248,246,242,.1)
    rounding = 90
    border_size = 3
    border_color = rgba(248,246,242,.05)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    #position = 34, -190
    halign = center
    valign = center
}
