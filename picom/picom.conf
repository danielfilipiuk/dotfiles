## ---------- General Settings----- ---------- ##
daemon = true;
backend = "glx";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
#use-ewmh-active-win = true;
detect-transient = true;
#detect-client-leader = true;
unredir-if-possible = true;
#unredir-if-possible-delay = 0;
# unredir-if-possible-exclude = []
use-damage = true;
#xrender-sync-fence = true;
force-win-blend = true;
#no-ewmh-fullscreen = false
# transparent-clipping = false
log-level = "warn";
# log-file = "/path/to/your/log/file"
# show-all-xerrors = false

##----------Shadows------------------------------##
shadow = true;
#shadow-radius = 12;
#shadow-offset-x = -7;
#shadow-offset-y = -15;
# shadow-red = 0
# shadow-green = 0
# shadow-blue = 0
# shadow-color = "#000000"
# clip-shadow-above = [ "window_type = 'dock'", ];
#shadow-exclude = [ "window_type = 'notification'", ];

## ---------- Fading ------------------------- ##
fading = true;
fade-in-step = 0.095;
fade-out-step = 0.095;
fade-delta = 10;
no-fading-openclose = false;
no-fading-destroyed-argb = false;
#fade-exclude = [ "window_type = 'popup_menu'", ];

## ---------- Transparency -------------------- ##
#active-opacity = 1;
#inactive-opacity = 1;
frame-opacity = 1;
#inactive-dim = 0;
#inactive-dim-fixed = 1.0;
#focus-exclude = [ "class_g = 'Cairo-clock'" ];
#opacity-rule = [ "95:window_type = 'dropdown_menu'", ];


## ---------- Corners ------------------------- ##
corner-radius = 10;
#rounded-corners-exclude = [ "class_i = 'xfce4-panel'", ];


## --------------- Rules ------------------------- ##
blur:
	{
#		method = "none";
		method = "gaussian";
		size = 1;
		deviation = 100;
	}
rules: (
#	{
#		blur-background = false;
#		fade = false;
#	},
	{
		match = "window_type = 'normal' || "
			"window_type = 'dialog' || "
			"class_i = 'brave-browser'";
# animations------------------------------------------##
		animations = (
# close animation ------------------------------------##
        {
            triggers = ["close"];
		preset = "disappear";
		scale = "0.5";
      		duration = 0.25;
		saved-image-blend = 1;
 	},

# open animation ------------------------------------##

        {
            triggers = ["open"];
		preset = "fly-in";
		direction = "up";
      		duration = 0.25;
		saved-image-blend = 1;
 	},

# show from minimized animation -------------------------##

        {
            triggers = ["show"];
		preset = "fly-in";
		direction = "down";
      		duration = 0.25;
		saved-image-blend = 1;
 	},

# hide to taskbar animation -----------------------------##

   	{
	    triggers = ["hide"];
		preset = "fly-out";
		direction = "down";
     		duration = 0.25;
		saved-image-blend = 1;
 	},

# geometry animation ------------------------------------##

        {
            triggers = ["size", "position"];
            scale-x = {
                curve = "cubic-bezier(0,0,0,1.28)";
                duration = 0.3;
                start = "window-width-before / window-width";
                end = 1;
            };

            scale-x-reverse = {
                curve = "cubic-bezier(0,0,0,1.28)";
                duration = 0.3;
                start = "window-width / window-width-before";
                end = 1;
            };

            scale-y = {
                curve = "cubic-bezier(0,0,0,1.28)";
                duration = 0.3;
                start = "window-height-before / window-height";
                end = 1;
            };

            scale-y-reverse = {
                curve = "cubic-bezier(0,0,0,1.28)";
                duration = 0.3;
                start = "window-height / window-height-before";
                end = 1;
            };

            offset-x = {
                curve = "cubic-bezier(0,0,0,1.28)";
                duration = 0.3;
                start = "window-x-before - window-x";
                end = 0;
            };

            offset-y = {
                curve = "cubic-bezier(0,0,0,1.28)";
                duration = 0.3;
                start = "window-y-before - window-y";
                end = 0;
            };

            shadow-scale-x = "scale-x";
            shadow-scale-y = "scale-y";

            shadow-offset-x = "offset-x";
            shadow-offset-y = "offset-y";
            }
	
	  ),},

# end of animations ------------------------------------##

