##################### screensaver ############################3
listener {
    timeout = 300                            	  # 60x5'
	on-timeout = pidof glmatrix || glmatrix_screensaver
}

#################### LOCK ############################3
listener {
    timeout = 600                                 # 60x10'.
    on-timeout = pidof hyprlock || app2unit -S out -- hyprlock -q  
}

#################### DPMS  ############################3
listener {
    timeout = 1800 								   # 60x30'
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

#################### SUSPEND ############################3
listener {
    timeout = 3600                                # 60x60' 
    on-timeout = systemctl suspend                # suspend pc.
}
