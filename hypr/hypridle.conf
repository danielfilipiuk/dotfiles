# sample hypridle.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || app2unit -S out -- hyprlock -q       # avoid starting multiple hyprlock instances.
#	lock-cmd = loginctl lock-session
    unlock_cmd = loginctl unlock-session
    before_sleep_cmd = pidof hyprlock || app2unit -S out -- hyprlock  
#    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
	inhibit_sleep = 3 # waits for hyprlock
}

